name: Build Guides
env:
  POPTUS_PKG:      ${{ github.workspace }}/poptus_pypkg
  GH_ACTIONS_PATH: ${{ github.workspace }}/.github/workflows
  DOCS_PATH:       ${{ github.workspace }}/docs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Get user/group of runner account so that subsequent jobs can run containers
  # using that account rather than root.  Based on discussions in:
  #                https://github.com/actions/runner/issues/691
  configure:
     runs-on: ubuntu-latest
     outputs:
       uid_gid: ${{ steps.get_user.outputs.uid_gid }}
     steps:
       - id: get_user
         run: |
            MY_UID=$(id -u)
            MY_GID=$(id -g)
            echo "User = $(id -u -n) ($MY_UID)"
            echo "Group = $(id -g -n) ($MY_GID)"
            echo "uid_gid=$MY_UID:$MY_GID" >> "$GITHUB_OUTPUT"

  # Prefer using the latest Python version supported by the package
  build_sphinx:
    # Installing LaTeX with apt can yield wildly different download times.  I
    # have seen as short as ~1 minute and as long as ~30 minutes.  Use official
    # docker image in the hopes that there is less variation without wasting too
    # much time downloading/loading the image.
    runs-on: ubuntu-latest
    needs: configure
    env:
      UID_GID: ${{ needs.configure.outputs.uid_gid }}
    container:
      image: texlive/texlive:latest
      options: --user ${{ needs.configure.outputs.uid_gid }}
    steps:
    ##-- General Setup Steps
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.14

    - name: Setup Python with tox
      run: |
        echo "UID/GID from configure = $UID_GID"
        echo "UID/GID actual         = $(id -u):$(id -g)"
        $GH_ACTIONS_PATH/setup_tox_github_action.sh ${{ runner.os }}

    - name: Build Sphinx docs
      run: |
        cd $POPTUS_PKG
        tox -r -e pdf,html

    ##-- Make documents available as artifacts
    - name: Archive POptUS docs
      uses: actions/upload-artifact@v7
      with:
        name: poptus-sphinx-docs
        path: |
          ${{ env.DOCS_PATH }}/build_*
