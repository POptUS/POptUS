# Specify a set of common tasks to aid developing and maintaining the POptUS
# Python package.  Tox automatically creates and manages individual Python
# virtual environments for each task so that these are run cleanly and
# independently.

[tox]
requires = tox>=4.40.0
env_list =

[testenv]
description = Run POptUS's full test suite with or without coverage
passenv =
    COVERAGE_HTML
    COVERAGE_XML
    COVERAGE_FILE
    POPTUS_MPI_IMPL
setenv =
    COV_HTML  = {env:COVERAGE_HTML:htmlcov}
    COV_XML   = {env:COVERAGE_XML:coverage.xml}
    COV_FILE  = {env:COVERAGE_FILE:.coverage_poptus}
    DOC_ROOT  = ../docs
    BOOK_ROOT = ../book
    MPI_IMPL  = {env:POPTUS_MPI_IMPL:}
extras =
    mpi
    {env:MPI_IMPL}
deps =
    coverage: coverage
usedevelop =
    nocoverage: false
    coverage:   true
commands =
    nocoverage: python -m unittest poptus -v
    coverage: coverage run --rcfile={toxinidir}/.coveragerc --data-file={env:COV_FILE} -m unittest discover -s ./src/poptus -t .. -v

[testenv:report]
description = Generate XML and HTML format coverage reports
depends = coverage
deps = coverage
skip_install = true
commands = 
    coverage combine --data-file={env:COV_FILE} -a {glob:.coverage_poptus.*}
    coverage xml     --data-file={env:COV_FILE} -o {env:COV_XML}
    coverage html    --data-file={env:COV_FILE} -d {env:COV_HTML}
    coverage report  --data-file={env:COV_FILE}

[testenv:check]
description = Check code against typical Python standards
deps =
    flake8
skip_install = true
commands =
    flake8 --config={toxinidir}/.flake8

[testenv:html]
description = Generate POptUS's documentation as HTML
deps =
    sphinx
    sphinx_rtd_theme
commands = 
    sphinx-build -E --fail-on-warning -b html {env:DOC_ROOT} {env:DOC_ROOT}/build_html

[testenv:pdf]
description = Generate POptUS's documentation as PDF file
deps =
    sphinx
allowlist_externals = make
commands = 
    sphinx-build -E --fail-on-warning -b latex {env:DOC_ROOT} {env:DOC_ROOT}/build_pdf
    make -C {env:DOC_ROOT}/build_pdf

[testenv:book]
description = Generate POptUS examples in Jupyter book
usedevelop = true
extras =
    mpi
    {env:MPI_IMPL}
deps =
    numpy
    pandas
    notebook
    jupyter-book<2.0.0
    nbdime
commands =
    jupyter-book clean --all {env:BOOK_ROOT}
    jupyter-book build --all --warningiserror {env:BOOK_ROOT}
