[files]
extend-exclude = [".git", "**/.ipynb_checkpoints"]
ignore-hidden = false

[default]
check-filename = true
check-file = true
binary = false
locale = "en"
unicode = true

[type.ipynb]
extend-glob = ["*.ipynb"]
extend-ignore-identifiers-re = ["ges", "nd"]

[type.sphinx_macros]
extend-glob = ["latex_macros_notation.json"]
extend-ignore-identifiers-re = ["nd"]

[type.book_macros]
extend-glob = ["_config.yml"]
extend-ignore-identifiers-re = ["nd"]
